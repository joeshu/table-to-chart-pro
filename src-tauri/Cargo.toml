[package]
name = "table-to-chart-pro"
version = "1.0.0"
edition = "2021"

[lib]
name = "table_to_chart_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "table_to_chart_pro_lib"
path = "src/main.rs"
crate-type = ["staticlib", "cdylib", "rlib"]
