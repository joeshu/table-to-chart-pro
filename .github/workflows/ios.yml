name: iOS IPA Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Validate frontend
        run: npm run check
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Initialize unsigned iOS project
        shell: bash
        run: |
          cargo tauri ios init --ci
          PBX=$(find src-tauri/gen/apple -name project.pbxproj | head -1)
          test -n "$PBX"
          perl -0pi -e 's/buildSettings = \{/buildSettings = {\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGN_IDENTITY = "";/g' "$PBX"
          grep -q 'CODE_SIGNING_ALLOWED = NO' "$PBX"
      - name: Build iOS application
        id: ios-build
        continue-on-error: true
        shell: bash
        run: cargo tauri ios build --ci --target aarch64 2>&1 | tee ios-build.log
      - name: Package verified unsigned IPA
        shell: bash
        run: |
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path '*/Build/Products/release-iphoneos/*.app' -type d 2>/dev/null | head -1)

          if [ -z "$APP" ]; then
            echo 'No release iOS .app bundle found after Tauri build'
            tail -120 ios-build.log || true
            exit 1
          fi

          test -f "$APP/Info.plist"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          test -n "$EXECUTABLE"
          test -f "$APP/$EXECUTABLE"

          if [ "${{ steps.ios-build.outcome }}" = "failure" ] && ! grep -q 'No Team Found in Archive' ios-build.log; then
            echo 'Tauri build failed for a reason other than the expected unsigned export limitation'
            tail -120 ios-build.log
            exit 1
          fi

          rm -rf Payload table-to-chart-pro-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry table-to-chart-pro-unsigned.ipa Payload
          unzip -t table-to-chart-pro-unsigned.ipa
          test -s table-to-chart-pro-unsigned.ipa
          echo "Packaged unsigned app from: $APP"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: table-to-chart-pro-unsigned-ipa
          path: table-to-chart-pro-unsigned.ipa
          if-no-files-found: error
