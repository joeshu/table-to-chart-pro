name: iOS IPA Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Validate frontend
        run: npm run check
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Initialize unsigned iOS project
        shell: bash
        run: |
          cargo tauri ios init --ci
          PBX=$(find src-tauri/gen/apple -name project.pbxproj | head -1)
          test -n "$PBX"
          perl -0pi -e 's/buildSettings = \{/buildSettings = {\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGN_IDENTITY = "";/g' "$PBX"
          grep -q 'CODE_SIGNING_ALLOWED = NO' "$PBX"
      - name: Build unsigned iOS app without archive export
        shell: bash
        run: |
          PROJECT=$(find src-tauri/gen/apple -name '*.xcodeproj' -type d | head -1)
          test -n "$PROJECT"
          SCHEME=$(xcodebuild -project "$PROJECT" -list -json | python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["schemes"][0])')
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -sdk iphoneos \
            -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            CONFIGURATION_BUILD_DIR="$PWD/ios-build" build
      - name: Package unsigned IPA
        shell: bash
        run: |
          APP=$(find ios-build -name '*.app' -type d | head -1)
          test -n "$APP" || { echo 'No iOS .app bundle found'; exit 1; }
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry table-to-chart-pro-unsigned.ipa Payload
          unzip -t table-to-chart-pro-unsigned.ipa
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: table-to-chart-pro-unsigned-ipa
          path: table-to-chart-pro-unsigned.ipa
          if-no-files-found: error
