name: iOS IPA Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Validate frontend
        run: npm run check
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Initialize unsigned iOS project
        shell: bash
        run: |
          cargo tauri ios init --ci
          PBX=$(find src-tauri/gen/apple -name project.pbxproj | head -1)
          test -n "$PBX"
          perl -0pi -e 's/buildSettings = \{/buildSettings = {\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGN_IDENTITY = "";/g' "$PBX"
          grep -q 'CODE_SIGNING_ALLOWED = NO' "$PBX"
      - name: Build iOS archive and extract unsigned app
        shell: bash
        run: |
          set +e
          cargo tauri ios build --ci --target aarch64 2>&1 | tee ios-build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          ARCHIVE=$(find src-tauri/gen/apple "$HOME/Library/Developer/Xcode/Archives" /tmp \
            -name '*.xcarchive' -type d 2>/dev/null | head -1)
          APP=""
          if [ -n "$ARCHIVE" ]; then
            APP=$(find "$ARCHIVE/Products/Applications" -name '*.app' -type d 2>/dev/null | head -1)
          fi

          if [ -z "$APP" ]; then
            echo "Tauri build exit code: $BUILD_STATUS"
            echo 'No archived iOS .app bundle found'
            tail -100 ios-build.log
            exit "${BUILD_STATUS:-1}"
          fi

          if [ "$BUILD_STATUS" -ne 0 ] && ! grep -q 'No Team Found in Archive' ios-build.log; then
            echo 'iOS build failed before the expected unsigned export limitation'
            tail -100 ios-build.log
            exit "$BUILD_STATUS"
          fi

          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry table-to-chart-pro-unsigned.ipa Payload
          unzip -t table-to-chart-pro-unsigned.ipa
          test -s table-to-chart-pro-unsigned.ipa
          echo "Packaged unsigned app from: $APP"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: table-to-chart-pro-unsigned-ipa
          path: table-to-chart-pro-unsigned.ipa
          if-no-files-found: error
